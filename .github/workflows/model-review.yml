name: Weekly model review

on:
  schedule:
    # Mondays at 17:23 UTC (09:23 PST / 10:23 PDT), away from the hourly peak.
    - cron: '23 17 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-model-review
  cancel-in-progress: false

env:
  # Keep weekly research running while deferring new proposals until mid-December.
  MODEL_REVIEW_PR_NOT_BEFORE: '2026-12-14'

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actionable: ${{ steps.result.outputs.actionable }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Avoid duplicate proposals and paid comparisons
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName --jq 'any(.[]; .headRefName | startswith("codex/model-update-"))')
          echo "exists=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = true ]; then
            echo 'An existing model-update PR awaits review; skipping paid research.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v7
        if: steps.pending.outputs.exists != 'true'
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        if: steps.pending.outputs.exists != 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install 'pytest>=8'

      - name: Research with GPT-6 through the Responses API
        if: steps.pending.outputs.exists != 'true'
        env:
          # Existing API organization billing/eligible credits; no Codex auth.
          OPENAI_API_KEY: ${{ secrets.MODEL_REVIEW_OPENAI_API_KEY }}
        run: python tools/review_models.py --output-dir "$RUNNER_TEMP/model-review"

      - name: Validate the proposed changes offline
        if: steps.pending.outputs.exists != 'true'
        run: |
          python -m py_compile tools/review_models.py schtick/*.py
          python -m pytest -q
          git diff --check

      - name: Record review result
        if: steps.pending.outputs.exists != 'true'
        id: result
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, datetime, timezone
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'model-review'
          actionable = json.loads((root / 'result.json').read_text())['actionable']
          not_before = date.fromisoformat(os.environ['MODEL_REVIEW_PR_NOT_BEFORE'])
          paused = datetime.now(timezone.utc).date() < not_before
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'actionable={str(actionable and not paused).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write((root / 'report.md').read_text())
              if paused:
                  handle.write(f'\n\nNew model-review PRs are paused until {not_before}. '
                               'Research and validation still ran; evidence is preserved in the artifact.\n')
          PY

      - name: Preserve review evidence
        if: steps.pending.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: model-review
          path: ${{ runner.temp }}/model-review/
          retention-days: 30
          if-no-files-found: error

  propose:
    needs: review
    if: needs.review.outputs.actionable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: model-review
          path: ${{ runner.temp }}/model-review

      - name: Open a draft model-update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The publishing job has no OpenAI key. It applies only the patch
          # produced by the successful research + offline-validation job.
          git apply --check "$RUNNER_TEMP/model-review/changes.patch"
          git apply "$RUNNER_TEMP/model-review/changes.patch"
          python - <<'PY'
          import subprocess
          allowed = {'schtick/providers.py', 'tests/test_providers.py',
                     'tests/test_deepseek_provider.py', 'tests/test_openai_provider.py',
                     'README.md', 'docs/model-review/latest.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).decode().splitlines())
          if not changed or changed - allowed:
              raise SystemExit('Refusing changes outside the model-default allowlist')
          subprocess.run(['git', 'add', '--', *sorted(changed)], check=True)
          PY
          branch="codex/model-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Propose reviewed model defaults'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" \
            --head "$branch" --draft --title 'Review recommended model updates' \
            --body-file "$RUNNER_TEMP/model-review/report.md"

