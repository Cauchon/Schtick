# Docker Compose setup for running both persona bots on a Raspberry Pi (or any
# arm64/amd64 host). Each service uses the same image/Dockerfile, and differs
# only in its `command` (the persona slug) and its env file.
#
# Logs: container stdout/stderr is available via `docker compose logs -f
# <service>` / `docker logs` (and journald too, if the Docker daemon's log
# driver is journald, as is typical on a systemd-managed Pi). The per-slug
# `<slug>.log` file written by the bot itself lives on the host in that
# service's data directory, alongside recent_posts_<slug>.json.
#
# State: each service bind-mounts a host directory at the container's working
# directory, so recent_posts_<slug>.json (the duplicate-post cache) and
# <slug>.log survive restarts and rebuilds AND stay readable on the host for
# inspection and backup. Without persistence the cache resets on every restart
# and the bot starts repeating quotes.
#
# A directory is mounted rather than individual files on purpose: Docker
# silently creates a *directory* in place of a bind-mounted file that doesn't
# exist yet on the host, which then breaks the bot's writes.
#
# First run: create the directories owned by the container's user (uid 1000),
# otherwise the non-root process can't write to them:
#   mkdir -p data/larry_david data/kramer && sudo chown -R 1000:1000 data
#
# Cutting over from the old service names (larry-david-bot, kramer-bot)? The
# rename below means `docker compose up -d --build` alone leaves the old
# containers running under their old names; add --remove-orphans to have
# Compose stop and remove them:
#   docker compose up -d --build --remove-orphans

services:
  schtick-larry-david:
    build: .
    image: schtick:latest
    command: larry_david
    env_file: .env.larry_david
    volumes:
      - ./data/larry_david:/home/appuser/data
    restart: unless-stopped

  schtick-kramer:
    build: .
    image: schtick:latest
    command: kramer
    env_file: .env.kramer
    volumes:
      - ./data/kramer:/home/appuser/data
    restart: unless-stopped

# Add a third persona: `python -m schtick new` scaffolds a characters/<slug>.md
# file and prints a ready-to-paste service block for this file (new slug for
# `command`, new `.env.<slug>` file, new data directory) -- see README.md.
